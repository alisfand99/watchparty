<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a WatchParty room</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8eaf0; font-family: system-ui, "Segoe UI", sans-serif; }
  .card { width: min(460px, 92vw); background: #181b22; border: 1px solid #2a2f3a; border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #9aa3b8; line-height: 1.6; }
  a.btn { display: block; text-align: center; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2f3a; color: #e8eaf0; text-decoration: none; background: #20242e; }
  a.btn.primary { background: #6c8cff; border-color: #6c8cff; color: #fff; font-weight: 600; }
  code { display: block; padding: 10px 12px; background: #0f1115; border: 1px solid #2a2f3a; border-radius: 10px; color: #e8eaf0; user-select: all; word-break: break-all; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>You are invited to a WatchParty</h1>
  <p id="msg">Watch movies, browse and hang out together with your cameras on.</p>
  <a id="open" class="btn primary hide" href="#">Open in WatchParty</a>
  <a class="btn" href="https://github.com/alisfand99/watchparty/releases/latest/download/WatchParty-Setup.exe">Download WatchParty for Windows</a>
  <div id="codeBox" class="hide">
    <p>Already have the app? Open it and paste this room code:</p>
    <code id="code"></code>
  </div>
</div>
<script>
  var code = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('codeBox').classList.remove('hide');
    var open = document.getElementById('open');
    open.href = 'watchparty://join/' + encodeURIComponent(code);
    open.classList.remove('hide');
    setTimeout(function () { location.href = open.href; }, 700);
  } else {
    document.getElementById('msg').textContent = 'Ask your friend for the invite link, or download the app first.';
  }
</script>
</body>
</html>
